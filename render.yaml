services:
  - type: web
    name: talamaddale-artha
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # sync: false means Render prompts you to fill these in the dashboard.
      # Leave them blank if every artiste will bring their own key in the browser.
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
